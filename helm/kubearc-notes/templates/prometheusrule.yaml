{{- if .Values.metrics.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
spec:
  groups:
  - name: {{ .Release.Name }}.rules
    rules:
    - alert: NotesReplicasUnavailable
      expr: |
        kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="{{ .Release.Name }}"}
          < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}", deployment="{{ .Release.Name }}"}
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "{{ .Release.Name }} in {{ .Release.Namespace }} has fewer ready Pods than it wants"
        description: "Check kubectl get pods -n {{ .Release.Namespace }} and the readiness probe (/readyz needs the database)."
    - alert: NotesPodStuck
      expr: |
        max by (pod, reason) (
          kube_pod_container_status_waiting_reason{namespace="{{ .Release.Namespace }}", reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"}
        ) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "A Pod in {{ .Release.Namespace }} is stuck waiting"
        description: "See the pod and reason labels of this alert; then kubectl describe pod."
    - alert: NotesHighErrorRate
      expr: |
        sum(rate(notes_http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
          / sum(rate(notes_http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "More than 5% of requests to {{ .Release.Name }} fail with 5xx"
        description: "Look at the Kubearc Notes dashboard and the app logs."
{{- end }}
