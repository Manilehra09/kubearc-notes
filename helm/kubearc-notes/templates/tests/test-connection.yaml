apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  labels:
    {{- include "notes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
  - name: wget
    image: busybox:1.37
    command: ["sh", "-c", "wget -qO- http://{{ .Release.Name }}:{{ .Values.service.port }}/readyz && wget -qO- http://{{ .Release.Name }}:{{ .Values.service.port }}/api/notes"]
