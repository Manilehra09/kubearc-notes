# Argo CD Application: dev follows main automatically.
# Replace YOU with your GitHub user name. Apply once: kubectl apply -f argocd/notes-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOU/kubearc-notes.git
    targetRevision: main
    path: helm/kubearc-notes
    helm:
      releaseName: notes-dev
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-dev
  syncPolicy:
    automated:
      prune: true        # delete what was removed from Git
      selfHeal: true     # undo changes made by hand in the cluster
    syncOptions:
      - CreateNamespace=true
